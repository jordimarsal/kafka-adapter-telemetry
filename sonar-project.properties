# SonarQube scanner defaults — picked up automatically by
# ~/homelab/sonarqube/analyze.sh when the scanner runs from the repo root.
# CLI -D flags override these, so this file is the single place to tune the scan.
#
# Run `mvn -q package` first: the Java analyzer needs the module bytecode and
# the JaCoCo XML reports that the build leaves under <module>/target/.
sonar.projectKey=jordimarsal:kafka-adapter-telemetry
sonar.sourceEncoding=UTF-8

# Build output plus generated, non-maintained HTML. docs/diagrams/*.html are
# archify exports with vendored JS inlined (~14k lines each) and docs/demo.html
# embeds a screen recording: they are build artifacts of the docs, not code.
# When this list is defined it replaces the scanner's default exclusions
# entirely, so the standard build-output patterns are kept here.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/.git/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/vendor/**,**/coverage/**,**/*.min.js,**/*.min.css,docs/diagrams/**,docs/demo.html

# Explicitly include everything; the CLI scanner leaves sources empty when
# only sonar.tests is set. Test files are re-categorised as tests via
# sonar.test.inclusions below (sonar.tests + a catch-all sonar.sources makes
# src/test/java index twice).
sonar.sources=.
sonar.test.inclusions=**/src/test/java/**,**/*.spec.ts,**/*.spec.tsx,**/*.spec.js,**/*.test.ts,**/*.test.tsx,**/*.test.js

# Java multi-module bytecode (full rule set + coverage import need it).
sonar.java.binaries=contracts/target/classes,adapter-gateway/target/classes,telemetry-hub/target/classes
sonar.java.test.binaries=contracts/target/test-classes,adapter-gateway/target/test-classes,telemetry-hub/target/test-classes

# Coverage: JaCoCo XML per Java module and lcov for the dashboard (both
# generated by `mvn package` / `npm --prefix dashboard test`; see
# docs/adr/0005-jacoco-coverage.md).
sonar.coverage.jacoco.xmlReportPaths=contracts/target/site/jacoco/jacoco.xml,adapter-gateway/target/site/jacoco/jacoco.xml,telemetry-hub/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=dashboard/coverage/lcov.info
